<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LOWERBOUND reschedules a college timetable into the fewest classrooms the week allows, and proves no schedule can use fewer." />
    <meta name="theme-color" content="#17221E" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>LOWERBOUND · Room Minimizer</title>
    <script>
      try {
        var t = localStorage.getItem("lowerbound-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
